name: Release

on:
  release:
    types: [published]

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        sm-version: [ '1.12.x' ]

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          path: build

      - uses: actions/checkout@v7

      - name: Setup SourcePawn
        uses: rumblefrog/setup-sp@master
        with:
          version: ${{ matrix.sm-version }}

      - name: Setup Working Directory
        run: |
          mkdir -p sourcemod/plugins
          mkdir -p sourcemod/scripting

          cp -r -f src/* sourcemod/scripting/
          
      - name: Build
        working-directory: src
        run: |
          for file in *.sp;
          do
            filename="${file%.*}"

            echo "Compiling $filename..."
            spcomp $file -O2 -v2 -iinclude -o ../sourcemod/plugins/$filename.smx
          done

      - name: Package
        working-directory: sourcemod
        run: 7z a ccprocessor-${{ matrix.sm-version }}.zip ./*
      
      - name: Attach extension
        uses: svenstaro/upload-release-action@v2
        with:
            repo_token: ${{ secrets.GITHUB_TOKEN }}
            file: 'sourcemod/ccprocessor-${{ matrix.sm-version }}.zip'
            asset_name: ccprocessor-$tag.${{ github.run_number }}.zip
            tag: ${{ github.ref }}
            file_glob: false 